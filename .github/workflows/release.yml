name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). If omitted, uses the ref that triggered the workflow.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build & Package VSIX
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: '*.vsix'
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          for i in 1 2 3; do
            echo "Attempt $i to publish to VS Code Marketplace..."
            if npx @vscode/vsce publish -p "$VSCE_PAT" --packagePath opencode-copilot-sync-*.vsix --no-dependencies; then
              echo "Published successfully!"
              exit 0
            fi
            echo "Publish attempt $i failed, waiting 15s before retry..."
            sleep 15
          done
          exit 1
