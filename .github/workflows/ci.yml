name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Run Docker container verification
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/workspace" -w /workspace node:22 npm test

      - name: Build & Package VSIX
        run: npm run package

  release:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record latest tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Auto bump version and tag
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
          git-user: 'github-actions[bot]'
          git-user-email: 'github-actions[bot]@users.noreply.github.com'

      - name: Push version commit and tag, then trigger release
        run: |
          BEFORE="${{ steps.before.outputs.tag }}"
          AFTER="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          if [ -z "$AFTER" ] || [ "$AFTER" = "$BEFORE" ]; then
            echo "Auto bump did not detect feat/fix — falling back to patch bump..."
            cog bump --patch
            AFTER="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          fi
          git push origin main
          git push origin "$AFTER"
          echo "Triggering release workflow for $AFTER..."
          gh workflow run release.yml --ref "$AFTER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
