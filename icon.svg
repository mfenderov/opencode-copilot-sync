<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>

    <!-- Sync Glow Gradient (OpenCode Cyan to Copilot Purple) -->
    <linearGradient id="syncGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Robot Metallic Gradient -->
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    <!-- Cyan Eye Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Orbital Sync Ring (Bidirectional Arrows) -->
  <!-- Top Arc (Purple to Cyan) -->
  <path d="M 64 16 A 48 48 0 0 1 112 64" fill="none" stroke="url(#syncGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Top Arrowhead -->
  <polygon points="112,56 112,68 120,62" fill="#a855f7"/>

  <!-- Bottom Arc (Cyan to Purple) -->
  <path d="M 64 112 A 48 48 0 0 1 16 64" fill="none" stroke="url(#syncGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Bottom Arrowhead -->
  <polygon points="16,72 16,60 8,66" fill="#00F0FF"/>

  <!-- Hubot Antenna -->
  <line x1="64" y1="41" x2="64" y2="33" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="30" r="4.5" fill="#00F0FF" filter="url(#cyanGlow)"/>

  <!-- Hubot Ears / Bolts -->
  <rect x="30" y="58" width="5" height="12" rx="2" fill="#4a5568"/>
  <rect x="93" y="58" width="5" height="12" rx="2" fill="#4a5568"/>

  <!-- Hubot Head Body -->
  <rect x="34" y="41" width="60" height="46" rx="10" fill="url(#botGrad)" stroke="#4a5568" stroke-width="2.5"/>

  <!-- Visor Screen -->
  <rect x="41" y="49" width="46" height="22" rx="5" fill="#0b0f17" stroke="#2d3748" stroke-width="1.5"/>

  <!-- Glowing Robot Eyes -->
  <circle cx="53" cy="60" r="4.5" fill="#00F0FF" filter="url(#cyanGlow)"/>
  <circle cx="75" cy="60" r="4.5" fill="#00F0FF" filter="url(#cyanGlow)"/>

  <!-- Cheerful Smile Line -->
  <path d="M 54 77 Q 64 83 74 77" fill="none" stroke="#718096" stroke-width="2.5" stroke-linecap="round"/>
</svg>
