<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Activity bar icon: 24x24 monochrome sync-orbit motif derived from icon.svg.
       Single color (#000) so VS Code can tint it for light/dark themes and states.
       No gradients, filters, background rects, or paint servers. -->
  <!-- Orbital sync ring (bidirectional arcs) -->
  <path d="M 12 3 A 9 9 0 0 1 21 12" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 12 21 A 9 9 0 0 1 3 12" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <!-- Arrowheads -->
  <polygon points="21,10.5 21,12.8 22.5,11.6" fill="#000"/>
  <polygon points="3,13.5 3,11.2 1.5,12.4" fill="#000"/>
  <!-- Antenna -->
  <line x1="12" y1="6.2" x2="12" y2="7.7" stroke="#000" stroke-width="0.6" stroke-linecap="round"/>
  <circle cx="12" cy="5.6" r="0.84" fill="#000"/>
  <!-- Ears / bolts -->
  <rect x="5.6" y="10.9" width="0.94" height="2.25" rx="0.4" fill="#000"/>
  <rect x="17.4" y="10.9" width="0.94" height="2.25" rx="0.4" fill="#000"/>
  <!-- Head with punched-out eyes and mouth (evenodd knockouts) -->
  <path fill="#000" fill-rule="evenodd" d="M 8.25 7.6875 H 15.75 A 1.875 1.875 0 0 1 17.625 9.5625 V 14.4375 A 1.875 1.875 0 0 1 15.75 16.3125 H 8.25 A 1.875 1.875 0 0 1 6.375 14.4375 V 9.5625 A 1.875 1.875 0 0 1 8.25 7.6875 Z M 9.1 11.25 a 0.84 0.84 0 1 0 1.68 0 a 0.84 0.84 0 1 0 -1.68 0 Z M 13.22 11.25 a 0.84 0.84 0 1 0 1.68 0 a 0.84 0.84 0 1 0 -1.68 0 Z M 10.6 14.1 H 13.4 A 0.5 0.5 0 0 1 13.9 14.6 A 0.5 0.5 0 0 1 13.4 15.1 H 10.6 A 0.5 0.5 0 0 1 10.1 14.6 A 0.5 0.5 0 0 1 10.6 14.1 Z"/>
</svg>
